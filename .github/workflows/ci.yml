name: Relay CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  relay-contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/hand-relay/requirements*.lock

      - name: Install deterministic non-GPU relay test dependencies
        run: >-
          python -m pip install
          --requirement services/hand-relay/requirements-ci.lock

      - name: Run relay contracts without CUDA
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest services/hand-relay/tests -q

      - name: Exercise reversible hand-relay edge operations
        run: bash ops/hand-relay/tests/manage-caddy-route.test.sh
