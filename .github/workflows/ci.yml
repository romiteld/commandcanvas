name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-unit-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use Python 3.11 for bounded training checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-training.txt

      - name: Pin package manager
        run: |
          npm install --global npm@11.5.2
          test "$(node --version)" = "v$(cat .nvmrc)"
          test "$(npm --version)" = "11.5.2"

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned training dependencies
        run: python -m pip install -r scripts/requirements-training.txt

      - name: Run build and unit gate
        run: npm run check
