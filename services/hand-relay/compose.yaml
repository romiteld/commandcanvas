name: commandcanvas-hand-relay

x-relay-environment: &relay-environment
  PRIVATE_HAND_RELAY_SIGNING_KEY: ${PRIVATE_HAND_RELAY_SIGNING_KEY:?set PRIVATE_HAND_RELAY_SIGNING_KEY}
  PRIVATE_HAND_RELAY_ALLOWED_ORIGINS: ${PRIVATE_HAND_RELAY_ALLOWED_ORIGINS:?set PRIVATE_HAND_RELAY_ALLOWED_ORIGINS}
  PRIVATE_HAND_RELAY_BIND_HOST: 0.0.0.0
  PRIVATE_HAND_RELAY_BIND_PORT: "8100"
  PRIVATE_HAND_RELAY_MAX_CONNECTIONS: "${PRIVATE_HAND_RELAY_MAX_CONNECTIONS:-2}"
  PRIVATE_HAND_RELAY_MAX_HANDSHAKES: "${PRIVATE_HAND_RELAY_MAX_HANDSHAKES:-8}"
  PRIVATE_HAND_RELAY_GPU_MEM_LIMIT_BYTES: "${PRIVATE_HAND_RELAY_GPU_MEM_LIMIT_BYTES:-805306368}"
  PRIVATE_HAND_RELAY_HANDSHAKE_TIMEOUT_SECONDS: "${PRIVATE_HAND_RELAY_HANDSHAKE_TIMEOUT_SECONDS:-5}"
  PRIVATE_HAND_RELAY_FRAME_IDLE_TIMEOUT_SECONDS: "${PRIVATE_HAND_RELAY_FRAME_IDLE_TIMEOUT_SECONDS:-5}"
  PRIVATE_HAND_RELAY_AUTHENTICATED_SESSION_TIMEOUT_SECONDS: "${PRIVATE_HAND_RELAY_AUTHENTICATED_SESSION_TIMEOUT_SECONDS:-1800}"
  PRIVATE_HAND_RELAY_INFERENCE_TIMEOUT_SECONDS: "${PRIVATE_HAND_RELAY_INFERENCE_TIMEOUT_SECONDS:-2}"

x-relay-runtime: &relay-runtime
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
        pids: 128
      reservations:
        memory: 512M
        devices:
          - driver: nvidia
            device_ids:
              - "${PRIVATE_HAND_RELAY_CUDA_DEVICE:-0}"
            capabilities:
              - gpu
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  shm_size: 128m

services:
  hand-relay-640:
    <<: *relay-runtime
    image: commandcanvas-hand-relay:yolo26-640-fp16
    build:
      context: ../..
      dockerfile: services/hand-relay/Dockerfile
      args:
        PRIVATE_HAND_RELAY_MODEL_SOURCE: services/hand-relay/models/yolo26_hand_pose_640_fp16.onnx
        PRIVATE_HAND_RELAY_MODEL_FILENAME: yolo26_hand_pose_640_fp16.onnx
        PRIVATE_HAND_RELAY_MODEL_SHA256: f85eae141155d4de959051d3c7d44f68f1881dfe6b6e180e33d6c3fc3372c59e
        PRIVATE_HAND_RELAY_MODEL_BYTES: "21547949"
    ports:
      - "127.0.0.1:8101:8100"
    environment:
      <<: *relay-environment
      PRIVATE_HAND_RELAY_MODEL_PATH: /models/yolo26_hand_pose_640_fp16.onnx
      PRIVATE_HAND_RELAY_MODEL_VARIANT: yolo26_hand_pose_640_fp16

  hand-relay-320-rollback:
    <<: *relay-runtime
    profiles:
      - rollback-320
    image: commandcanvas-hand-relay:yolo26-320-fp16-rollback
    build:
      context: ../..
      dockerfile: services/hand-relay/Dockerfile
      args:
        PRIVATE_HAND_RELAY_MODEL_SOURCE: public/models/yolo26_hand_pose_320_fp16.onnx
        PRIVATE_HAND_RELAY_MODEL_FILENAME: yolo26_hand_pose_320_fp16.onnx
        PRIVATE_HAND_RELAY_MODEL_SHA256: 07a1cfb3d782d4bfd3b8843dbe8b3af971fc9f297c33ea5d14893ed8704e81fc
        PRIVATE_HAND_RELAY_MODEL_BYTES: "21447188"
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      <<: *relay-environment
      PRIVATE_HAND_RELAY_MODEL_PATH: /models/yolo26_hand_pose_320_fp16.onnx
      PRIVATE_HAND_RELAY_MODEL_VARIANT: yolo26_hand_pose_320_fp16
